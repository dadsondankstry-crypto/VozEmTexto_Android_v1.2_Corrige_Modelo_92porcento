name: Gerar APK de teste - Voz em Texto

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compilar aplicativo Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar arquivos na raiz do repositorio
        shell: bash
        run: |
          set -euo pipefail
          echo "Diretorio de trabalho: $PWD"
          ls -la
          test -f settings.gradle.kts || { echo '::error::settings.gradle.kts nao foi encontrado na raiz. Envie o conteudo do ZIP diretamente para a raiz do repositorio, sem pasta extra.'; exit 1; }
          test -f app/build.gradle.kts || { echo '::error::app/build.gradle.kts nao foi encontrado. Confira a estrutura do projeto.'; exit 1; }

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v4

      - name: Verificar Android SDK e instalar API 35
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-nao_definido}"
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Conferir Gradle
        run: gradle --version

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: VozEmTexto-APK-para-instalar
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
